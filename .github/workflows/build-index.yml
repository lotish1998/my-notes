name: Build Notes Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run index generator
        run: python3 generate_index.py

      - name: Commit updated index (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add INDEX.md
          git diff --staged --quiet || git commit -m "chore: auto-update INDEX.md [skip ci]"
          git push
